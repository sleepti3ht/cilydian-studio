[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cilydian-studio"
version = "0.1.0"
description = "Textual TUI client for CiLydian: human-in-the-loop agentic CI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{name = "sleepti3ht", email = "sleepti3ht@gmail.com"}]
dependencies = [
    "cilydian>=0.2.0",
    "textual>=0.80",
    "langgraph-checkpoint-sqlite>=2.0",
]

[project.scripts]
cilydian-studio = "studio.app:main_entry"

[project.urls]
Homepage = "https://github.com/sleepti3ht/cilydian-studio"
Repository = "https://github.com/sleepti3ht/cilydian-studio"
